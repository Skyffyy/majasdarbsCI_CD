name: CI/CD

on:
  pull_request:
    branches: [dev, pre-release, main]
  push:
    branches: [dev, pre-release, main]

env:
  PROD_DIR: C:\VSC\CI_CD\production

defaults:
  run:
    shell: powershell

jobs:
  # ---------- PULL REQUEST ----------
  pr-tests:
    name: PR tests
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # PR -> dev
      - name: UNIT TEST
        if: github.base_ref == 'dev'
        run: python -m unittest -v test.UnitTest

      # PR -> pre-release
      - name: UNIT TEST
        if: github.base_ref == 'pre-release'
        run: python -m unittest -v test.UnitTest
      - name: INTEGRATION TEST
        if: github.base_ref == 'pre-release'
        run: python -m unittest -v test.IntegrationTest
      - name: REGRESSION TEST
        if: github.base_ref == 'pre-release'
        run: python -m unittest -v test.RegressionTest

      # PR -> main
      - name: BUILD
        if: github.base_ref == 'main'
        run: python -m py_compile app.py
      - name: SMOKE TEST
        if: github.base_ref == 'main'
        run: python -m unittest -v test.SmokeTest
      - name: REGRESSION TEST
        if: github.base_ref == 'main'
        run: python -m unittest -v test.RegressionTest

  pr-approved:
    name: PR approved
    needs: pr-tests
    runs-on: self-hosted
    environment: pr-approval   # manuali: Approve / Reject
    steps:
      - run: echo "PR apstiprinats, var spiest Merge"

  # ---------- PUSH -> dev ----------
  dev:
    name: dev tests
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: UNIT TEST
        run: python -m unittest -v test.UnitTest
      - name: INTEGRATION TEST
        run: python -m unittest -v test.IntegrationTest

  # ---------- PUSH -> pre-release ----------
  pre-release:
    name: pre-release tests
    if: github.event_name == 'push' && github.ref_name == 'pre-release'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: UNIT TEST
        run: python -m unittest -v test.UnitTest
      - name: LINT TEST
        run: |
          python -m pip install -q flake8
          python -m flake8 --max-line-length 120 app.py test.py
      - name: INTEGRATION TEST
        run: python -m unittest -v test.IntegrationTest
      - name: REGRESSION TEST
        run: python -m unittest -v test.RegressionTest
      - name: REGISTRATION TEST
        run: python -m unittest -v test.RegistrationTest
      - name: STRESS TEST
        run: python -m unittest -v test.StressTest

  manual-testing:
    name: MANUAL TESTING
    needs: pre-release
    runs-on: self-hosted
    environment: manual-testing   # manuali: Approve / Reject
    steps:
      - run: echo "Manuala testesana apstiprinata"

  # ---------- PUSH -> main ----------
  production:
    name: main deploy
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: BUILD
        run: python -m py_compile app.py

      - name: DEPLOY TO PROD
        id: deploy
        run: |
          New-Item -ItemType Directory -Force $env:PROD_DIR | Out-Null
          if (Test-Path "$env:PROD_DIR\app.py") {
            Copy-Item "$env:PROD_DIR\app.py" "$env:PROD_DIR\app.py.bak" -Force
          }
          Copy-Item app.py "$env:PROD_DIR\app.py" -Force
          echo "Izvietots uz $env:PROD_DIR"

      - name: SMOKE TEST after deploy
        run: |
          $env:APP_DIR = $env:PROD_DIR
          python -m unittest -v test.SmokeTest

      - name: ROLLBACK
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          if (Test-Path "$env:PROD_DIR\app.py.bak") {
            Copy-Item "$env:PROD_DIR\app.py.bak" "$env:PROD_DIR\app.py" -Force
            echo "Rollback: atjaunota ieprieksejo versija"
          } else {
            Remove-Item "$env:PROD_DIR\app.py" -Force
            echo "Rollback: pirmais deploy neizdevas, app.py nonemts"
          }